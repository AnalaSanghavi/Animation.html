<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
    }

    .gif-container {
      max-width: 600px;
      width: 90%;
      text-align: center;
    }

    .gif-container img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="gif-container">
    <img
      src="https://i.pinimg.com/originals/3f/d2/23/3fd22342b0a9f3e4ef3d4d46d16ce13a.gif"
      alt="Required animation GIF"
    />
  </div>
</body>
</html>
