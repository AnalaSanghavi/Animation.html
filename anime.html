<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        .b1,.b2,.b3,.b4,.b5,.b6,.b7,.b8,.b9,.b10,.b11,.b12,.b13,.b14,.b15{
            position: absolute;
            display: inline-block;
            width: 15px;
            border-radius: 10px;
            transition-timing-function: ease-in-out;
            animation: anime 1s linear infinite alternate;
        }
        .b1{
            height: 20px;
            left: 300px;
            top: 300px;
            background-color: deeppink;
        }  
        .b2{
            height: 50px;
            left: 315px;
            top: 270px;
            background-color: rgb(231, 68, 155);
            animation-delay: 0;
            transition-timing-function: ease-out;
        }
        .b3{
            height: 30px;
            left: 330px;
            top: 290px;
            background-color: rgb(220, 51, 141);
        }
        .b4{
            height: 20px;
            left: 345px;
            top: 300px;
            background-color: rgb(189, 62, 130);
        }
        .b5{
            height: 70px;
            left: 360px;
            top: 250px;
            background-color: rgb(192, 49, 125);
            transition-timing-function: ease-out;
        }.b6{
            height: 50px;
            left: 375px;
            top: 270px;
            background-color: rgb(121, 28, 78);
            transition-timing-function: ease-out;
        }
        .b7{
            height: 40px;
            left: 390px;
            top: 280px;
            background-color: rgb(111, 20, 84);
        }
        .b8{
            height: 90px;
            left: 405px;
            top: 230px;
            background-color: rgb(125, 28, 98);
            transition-timing-function: ease-out;
        }.b9{
            height: 50px;
            left: 420px;
            top: 270px;
            background-color: rgb(139, 21, 84);
        }.b10{
            height: 30px;
            left: 435px;
            top: 290px;
            background-color: rgb(164, 27, 100);
        }.b11{
            height: 70px;
            left: 450px;
            top: 250px;
            background-color: rgb(192, 49, 125);
            transition-timing-function: ease-out;
        }.b12{
            height: 20px;
            left: 465px;
            top: 300px;
            background-color: rgb(189, 62, 130);
        }
        .b13{
            height: 30px;
            left: 480px;
            top: 290px;
            background-color: rgb(220, 51, 141);
        }
        .b14{
            height: 50px;
            left: 495px;
            top: 270px;
            background-color: rgb(231, 68, 155);
            animation-delay: 0;
            transition-timing-function: ease-out;
        }
        .b15{
            height: 20px;
            left: 510px;
            top: 300px;
            background-color: deeppink;
        }
        @keyframes anime{
            from{
                transform: scaleY(0.5);
            }to{
                transform: scaleY(1.5);
            }
        }
    </style>
</head>
<body>
    <div class="b1"></div>
    <div class="b2"></div>
    <div class="b3"></div>
    <div class="b4"></div>
    <div class="b5"></div>
    <div class="b6"></div>
    <div class="b7"></div>
    <div class="b8"></div>
    <div class="b9"></div>
    <div class="b10"></div>
    <div class="b11"></div>
    <div class="b12"></div>
    <div class="b13"></div>
    <div class="b14"></div>
    <div class="b15"></div>
</body>
</html>
